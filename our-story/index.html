<!DOCTYPE html>
<html lang="en">
<head>

  <!-- ═══════════════════════════════════════════════════════════════
       EDIT ME · Browser tab title
       ═══════════════════════════════════════════════════════════════ -->

  <!-- Film-grain overlay (decorative, do not edit) -->
  <div class="grain" aria-hidden="true"></div>

  <!-- ════════════════════════════════════════════════════════════════
       SCENE 01 · THE OPENING
       A dark, hushed title sequence. Scrolling drives each moment.
       ════════════════════════════════════════════════════════════════ -->
  <section class="scene-opening" id="opening">
    <div class="opening-glow" aria-hidden="true"></div>

    <div class="opening-stage">

      <!-- Moment 1 · the first thing they see -->
      <div class="intro-screen">
        <div class="intro-ornament" aria-hidden="true">
          <svg viewBox="0 0 40 34" width="26" height="22" fill="none">
            <path d="M20 30C20 30 3 19.5 3 9.8 3 4.9 7 2 11 2c4.3 0 7.4 3 9 6.2C21.6 5 24.7 2 29 2c4 0 8 2.9 8 7.8C37 19.5 20 30 20 30Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <!-- EDIT ME · The very first words on screen -->
        <p class="intro-label">For my favorite person</p>
      </div>

      <!-- Moment 2 · two lines, revealed one at a time -->
      <div class="opening-line line-1">
        <span class="mask"><span class="mask-inner">
          <!-- EDIT ME · Opening line one -->
          Some stories are written in big moments.
        </span></span>
      </div>

      <div class="opening-line line-2">
        <span class="mask"><span class="mask-inner">
          <!-- EDIT ME · Opening line two -->
          Ours was written in the little ones.
        </span></span>
      </div>

      <!-- Moment 3 · the names -->
      <div class="names-group">
        <!-- EDIT ME · Small script word above the names -->
        <p class="names-script">celebrating</p>

        <!-- EDIT ME · Your names -->
        <h1 class="names-title">Amara <span class="amp">&amp;</span> James</h1>

        <div class="names-rule" aria-hidden="true"></div>

        <!-- EDIT ME · Your date -->
        <p class="names-date">Together since 07 · 07 · 2020</p>
      </div>

    </div>

    <!-- Scroll cue -->
    <div class="scroll-cue" aria-hidden="true">
      <span class="scroll-cue-label">Scroll</span>
      <span class="scroll-cue-line"><span class="scroll-cue-line-inner"></span></span>
    </div>
  </section>

  <!-- ════════════════════════════════════════════════════════════════
       SCENE 02 · THE BEGINNING  (placeholder — next scene to be built)
       Cream paper rises over the dark opening with a torn edge.
       ════════════════════════════════════════════════════════════════ -->

    <div class="beginning-inner">
      <p class="chapter-label">Chapter One</p>
      <h2 class="chapter-title">The Beginning</h2>
      <p class="chapter-placeholder">— next scene, coming soon —</p>
    </div>
  </section>

  <noscript>
