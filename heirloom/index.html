<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>You Are Invited</title>
<meta name="description" content="A wedding invitation.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%236B2E2A'/><text x='50' y='63' font-size='40' text-anchor='middle' fill='%23F3EBDD' font-family='Georgia'>&amp;</text></svg>">
</head>
<body class="is-locked">

<!-- ======================================================================
     SHARED SVG ARTWORK  (filters, patterns, symbols — all original)
     ====================================================================== -->
<svg class="svg-defs" aria-hidden="true" focusable="false">
  <defs>
    <!-- Torn / deckled paper edges (three seeds so papers differ) -->
    <filter id="deckle1" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.017 0.028" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11"/>
    </filter>
    <filter id="deckle2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021 0.024" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
    </filter>
    <filter id="deckle3" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="23" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="10"/>
    </filter>

    <!-- Embossed relief for the floral corners -->
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-0.8" dy="-0.9" stdDeviation="0.7" flood-color="#FFFFFF" flood-opacity="0.9"/>
      <feDropShadow dx="1.1" dy="1.3" stdDeviation="1.1" flood-color="#8C7457" flood-opacity="0.38"/>
    </filter>

    <!-- Wax seal body -->
    <radialGradient id="sealGrad" cx="0.38" cy="0.34" r="0.75">
      <stop offset="0%"  stop-color="#8E4740"/>
      <stop offset="55%" stop-color="#6B2E2A"/>
      <stop offset="100%" stop-color="#471E1B"/>
    </radialGradient>

    <!-- Orchid petal tones -->
    <radialGradient id="orchGrad" cx="0.3" cy="0.3" r="1">
      <stop offset="0%"  stop-color="#7D4B3A"/>
      <stop offset="70%" stop-color="#5E352B"/>
      <stop offset="100%" stop-color="#452620"/>
    </radialGradient>

    <!-- Envelope liner: quiet sepia branches on champagne -->
    <pattern id="linerPat" width="72" height="72" patternUnits="userSpaceOnUse">
      <rect width="72" height="72" fill="#E4D4B6"/>
      <path d="M8 66 C22 50 26 34 40 20 M40 20 C44 15 50 12 56 11 M28 42 C33 40 37 36 39 31 M16 58 C21 57 25 54 27 50"
            fill="none" stroke="#B08D5F" stroke-width="1" opacity="0.5" stroke-linecap="round"/>
      <path d="M39 31 c4 -1 7 -4 8 -8 c-4 0 -7 3 -8 8 Z M27 50 c4 -1 6 -3 7 -7 c-4 1 -6 3 -7 7 Z"
            fill="#B08D5F" opacity="0.45"/>
      <circle cx="58" cy="18" r="1.4" fill="#B08D5F" opacity="0.5"/>
      <circle cx="47" cy="27" r="1.1" fill="#B08D5F" opacity="0.4"/>
      <circle cx="12" cy="30" r="1.2" fill="#B08D5F" opacity="0.35"/>
    </pattern>

    <!-- A single leaf, reused across flourishes -->
    <g id="leaf">
      <path d="M0 0 C7 -9 20 -11 28 -4 C20 4 7 5 0 0 Z"/>
    </g>

    <!-- Five-petal blossom -->
    <g id="bloom">
      <g>
        <ellipse cx="0" cy="-11" rx="6.2" ry="9"/>
        <ellipse cx="10.5" cy="-3.4" rx="6.2" ry="9" transform="rotate(72 10.5 -3.4)"/>
        <ellipse cx="6.5" cy="8.9" rx="6.2" ry="9" transform="rotate(144 6.5 8.9)"/>
        <ellipse cx="-6.5" cy="8.9" rx="6.2" ry="9" transform="rotate(216 -6.5 8.9)"/>
        <ellipse cx="-10.5" cy="-3.4" rx="6.2" ry="9" transform="rotate(288 -10.5 -3.4)"/>
        <circle cx="0" cy="0" r="3.4"/>
      </g>
    </g>

    <!-- Embossed corner flourish (used on the invitation card) -->
    <g id="flourish">
      <path d="M4 150 C10 106 26 68 56 42 C86 16 126 6 168 8" fill="none" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M30 96 C44 88 54 74 58 58" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M92 26 C104 34 120 36 134 32" fill="none" stroke-width="2.2" stroke-linecap="round"/>
      <use href="#leaf" transform="translate(20 118) rotate(-58)"/>
      <use href="#leaf" transform="translate(34 88) rotate(-46) scale(0.85)"/>
      <use href="#leaf" transform="translate(52 60) rotate(-30)"/>
      <use href="#leaf" transform="translate(80 34) rotate(-12) scale(0.9)"/>
      <use href="#leaf" transform="translate(118 14) rotate(4) scale(0.8)"/>
      <use href="#leaf" transform="translate(58 52) rotate(140) scale(0.7)"/>
      <use href="#leaf" transform="translate(96 22) rotate(158) scale(0.65)"/>
      <use href="#bloom" transform="translate(150 22) scale(1.15)"/>
      <use href="#bloom" transform="translate(10 150) scale(0.85)"/>
      <circle cx="176" cy="40" r="2.6"/>
      <circle cx="186" cy="26" r="2"/>
      <circle cx="30" cy="132" r="2.4"/>
      <circle cx="44" cy="112" r="1.8"/>
    </g>

    <!-- Muted orchid for dressing the linen -->
    <g id="orchidPetal">
      <path d="M0 0 C20 -22 56 -26 72 -8 C78 0 76 12 64 18 C44 28 14 20 0 0 Z"/>
    </g>
    <g id="orchid">
      <g fill="url(#orchGrad)">
        <use href="#orchidPetal" transform="rotate(-118) scale(0.92)"/>
        <use href="#orchidPetal" transform="rotate(-62) scale(0.92) scale(-1 1)"/>
        <use href="#orchidPetal" transform="rotate(-24)"/>
        <use href="#orchidPetal" transform="rotate(204) scale(-1 1)"/>
        <use href="#orchidPetal" transform="rotate(66) scale(0.8)"/>
      </g>
      <path d="M-14 -4 C-6 -14 6 -14 14 -4 C10 6 4 10 0 16 C-4 10 -10 6 -14 -4 Z" fill="#8A5A43"/>
      <circle cx="0" cy="-2" r="3.6" fill="#F0E4D0"/>
      <path d="M-40 -30 C-20 -16 -10 -8 0 0 M42 -26 C24 -14 10 -6 0 0 M0 34 C0 20 0 10 0 0"
            fill="none" stroke="#3D211C" stroke-width="0.8" opacity="0.25"/>
    </g>

    <!-- Baby's breath sprig -->
    <g id="sprig">
      <path d="M0 60 C4 40 6 26 4 8 M4 30 C12 24 18 16 20 6 M4 44 C-4 38 -10 30 -11 20 M4 18 C9 14 12 9 13 2"
            fill="none" stroke="#B4A183" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="4" cy="6" r="3.2"/><circle cx="20" cy="4" r="2.7"/>
      <circle cx="-11" cy="18" r="2.9"/><circle cx="13" cy="0" r="2.4"/>
      <circle cx="-4" cy="34" r="2.2"/><circle cx="11" cy="22" r="2.1"/>
    </g>

    <!-- Dried stem -->
    <g id="driedStem">
      <path d="M0 120 C8 86 4 52 14 22 C17 13 22 6 28 0" fill="none" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M6 96 l-10 -8 M8 78 l11 -7 M6 58 l-10 -7 M10 40 l11 -6 M14 24 l-9 -7 M18 14 l9 -5"
            fill="none" stroke-width="1.3" stroke-linecap="round"/>
    </g>

    <!-- Thin line icons for the schedule -->
    <g id="icon-rings" fill="none" stroke-width="1.4">
      <circle cx="9.5" cy="13" r="6"/><circle cx="15.5" cy="10" r="6"/>
      <path d="M13.5 3.6 L15.5 1 L17.5 3.6" stroke-linejoin="round"/>
    </g>
    <g id="icon-glass" fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M6 3 H18 C18 9 15 12 12 12 C9 12 6 9 6 3 Z M12 12 V20 M8 21 H16"/>
    </g>
    <g id="icon-dinner" fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M3 17 C3 11 7 7 12 7 C17 7 21 11 21 17 Z M1.5 20 H22.5 M12 7 V5 M10.7 4 A1.3 1.3 0 0 1 13.3 4"/>
    </g>
    <g id="icon-cake" fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M4 20 H20 M5 20 V14 H19 V20 M8 14 V9.5 H16 V14 M12 9.5 V6.5 M12 6.5 C10.8 5.6 10.8 4.2 12 3 C13.2 4.2 13.2 5.6 12 6.5 Z"/>
    </g>
    <g id="icon-music" fill="none" stroke-width="1.4" stroke-linecap="round">
      <path d="M9 18 V5 L19 3 V16 M9 8 L19 6"/>
      <circle cx="6.6" cy="18" r="2.4"/><circle cx="16.6" cy="16" r="2.4"/>
    </g>
    <g id="icon-sparkle" fill="none" stroke-width="1.4" stroke-linejoin="round">
      <path d="M12 3 C12.7 7.5 14.5 9.3 19 10 C14.5 10.7 12.7 12.5 12 17 C11.3 12.5 9.5 10.7 5 10 C9.5 9.3 11.3 7.5 12 3 Z M18.5 15.5 L19 17.5 L21 18 L19 18.5 L18.5 20.5 L18 18.5 L16 18 L18 17.5 Z"/>
    </g>
  </defs>
</svg>

<!-- Soft warmth that grows as guests near the RSVP -->
<div id="warmth" aria-hidden="true"></div>

<!-- Drifting petals -->
<div id="petals" aria-hidden="true"></div>

<!-- ======================================================================
     THE INTRO — sealed envelope on the linen table
     ====================================================================== -->
<div id="intro">
  <div class="intro-stage" id="introStage">
    <div class="table-dressing" aria-hidden="true">
      <svg class="dress dress-orchid-1" viewBox="-90 -70 180 150"><use href="#orchid"/></svg>
      <svg class="dress dress-sprig-1" viewBox="-20 -6 48 72" fill="#F1E9D8"><use href="#sprig"/></svg>
      <svg class="dress dress-stem-1" viewBox="-6 -4 40 130" stroke="#A98F6F"><use href="#driedStem"/></svg>
    </div>

    <div class="envelope" id="envelope">
      <div class="env-back"></div>
      <div class="env-liner">
        <svg viewBox="0 0 500 350" preserveAspectRatio="xMidYMid slice"><rect width="500" height="350" fill="url(#linerPat)"/></svg>
      </div>

      <!-- The folded card that rises from the envelope -->
      <div class="folded-card" id="foldedCard">
        <div class="fc-page">
          <div class="fc-inside">
            <svg class="card-flourish tl" viewBox="0 0 200 170" aria-hidden="true"><g class="flourish-ink" filter="url(#emboss)"><use href="#flourish" transform="scale(0.9)"/></g></svg>
            <svg class="card-flourish br" viewBox="0 0 200 170" aria-hidden="true"><g class="flourish-ink" filter="url(#emboss)"><use href="#flourish" transform="translate(200 170) rotate(180) scale(0.9)"/></g></svg>
            <p class="fc-invite-line" id="fcInviteLine"></p>
            <h2 class="fc-names"><span id="fcName1"></span><em class="amp">and</em><span id="fcName2"></span></h2>
            <p class="fc-date" id="fcDate"></p>
          </div>
        </div>
        <div class="fc-cover" id="fcCover">
          <div class="fc-cover-front">
            <div class="emboss-date" id="embossDate"></div>
            <div class="satin-band" aria-hidden="true"></div>
            <div class="fc-monogram" id="fcMonogram"></div>
          </div>
          <div class="fc-cover-back"></div>
        </div>
      </div>

      <div class="env-front"></div>
      <p class="env-address" id="envAddress"></p>

      <div class="env-flap" id="envFlap">
        <div class="flap-outer"></div>
        <div class="flap-inner">
          <svg viewBox="0 0 500 280" preserveAspectRatio="xMidYMid slice"><rect width="500" height="280" fill="url(#linerPat)"/></svg>
        </div>
      </div>

      <!-- The wax seal (a real button) -->
      <button class="seal" id="seal" aria-label="Break the seal and open the invitation">
        <span class="seal-whole">
          <svg viewBox="0 0 120 120">
            <path class="seal-blob" d="M60 8 C75 6 88 14 96 24 C104 33 112 44 110 58 C108 71 106 84 96 93 C86 102 74 110 60 111 C46 112 32 104 23 94 C14 84 8 72 9 58 C10 44 16 31 26 21 C36 12 45 10 60 8 Z" fill="url(#sealGrad)"/>
            <circle cx="60" cy="60" r="41" fill="none" stroke="#2E1210" stroke-width="1.6" opacity="0.5"/>
            <circle cx="60" cy="60" r="38.5" fill="none" stroke="#C98F82" stroke-width="1" opacity="0.35"/>
            <ellipse cx="44" cy="36" rx="20" ry="10" fill="#FFFFFF" opacity="0.14" transform="rotate(-28 44 36)"/>
            <text class="seal-init i1" x="41" y="69">O</text>
            <text class="seal-amp" x="60" y="74">&amp;</text>
            <text class="seal-init i2" x="80" y="69">A</text>
          </svg>
        </span>
        <span class="seal-half left" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <g>
              <path class="seal-blob" d="M60 8 C75 6 88 14 96 24 C104 33 112 44 110 58 C108 71 106 84 96 93 C86 102 74 110 60 111 C46 112 32 104 23 94 C14 84 8 72 9 58 C10 44 16 31 26 21 C36 12 45 10 60 8 Z" fill="url(#sealGrad)"/>
              <circle cx="60" cy="60" r="41" fill="none" stroke="#2E1210" stroke-width="1.6" opacity="0.5"/>
              <text class="seal-init i1" x="41" y="69">O</text>
              <text class="seal-amp" x="60" y="74">&amp;</text>
            </g>
          </svg>
        </span>
        <span class="seal-half right" aria-hidden="true">
          <svg viewBox="0 0 120 120">
            <g>
              <path class="seal-blob" d="M60 8 C75 6 88 14 96 24 C104 33 112 44 110 58 C108 71 106 84 96 93 C86 102 74 110 60 111 C46 112 32 104 23 94 C14 84 8 72 9 58 C10 44 16 31 26 21 C36 12 45 10 60 8 Z" fill="url(#sealGrad)"/>
              <circle cx="60" cy="60" r="41" fill="none" stroke="#2E1210" stroke-width="1.6" opacity="0.5"/>
              <ellipse cx="44" cy="36" rx="20" ry="10" fill="#FFFFFF" opacity="0.14" transform="rotate(-28 44 36)"/>
              <text class="seal-init i2" x="80" y="69">A</text>
            </g>
          </svg>
        </span>
      </button>
    </div>

    <p class="tap-hint" id="tapHint"></p>
  </div>
  <button class="skip-intro" id="skipIntro">skip</button>
</div>

<!-- ======================================================================
     THE INVITATION SITE  (sections are composed by script.js)
     ====================================================================== -->
<main id="site" aria-hidden="true"></main>

<button id="muteBtn" class="mute-btn" aria-label="Mute sound" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path class="mb-speaker" d="M4 9.5 H7.5 L12 5.5 V18.5 L7.5 14.5 H4 Z"/>
    <path class="mb-waves" d="M15.5 9 C16.8 10.7 16.8 13.3 15.5 15 M18 7 C20.3 9.8 20.3 14.2 18 17"/>
    <path class="mb-cross" d="M16 10 L21 15 M21 10 L16 15"/>
  </svg>
</button>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
