<!doctype html>
<html lang="en" data-editor-surface="canvas">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4efe7">
  <title>Editable invitation canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" id="editorStylesheet">
</head>
<body>
  <main class="canvas-page" id="canvasRoot" aria-label="Editable invitation canvas"></main>
  <script>
    (() => { const loader = document.createElement('script'); loader.src = `visual-editor-bootstrap.js?refresh=${Date.now()}`; document.head.append(loader); })();
  </script>
</body>
</html>
