<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ee">
  <meta name="description" content="Green sage wedding invitation for Alexandra and Gabriel on 24 August 2027.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Green Sage – Wedding Invite — Alexandra &amp; Gabriel">
  <meta property="og:description" content="Join us in Toronto on 24 August 2027.">
  <meta property="og:image" content="og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="og.png">
  <link rel="icon" href="data:,">
  <link rel="preload" href="invitation-assets/envelope-liner-optimized.jpg" as="image">
  <link rel="preload" href="invitation-assets/envelope-lace-white.jpg" as="image">
  <link rel="preload" href="invitation-assets/wax-seal-blank-optimized.png" as="image">
  <title>Green Sage – Wedding Invite — Alexandra &amp; Gabriel</title>
  <link rel="stylesheet" href="styles.css?v=20260802-envelope-foreground">
</head>
<body>
  <main class="page">
    <input class="open-control" id="openControl" type="checkbox" tabindex="-1" aria-hidden="true">
    <section class="artboard" aria-label="Private invitation">
      <header class="heading">
        <h1>
          <span class="heading-kicker">A Private</span>
          <span class="heading-title">Invitation</span>
        </h1>
        <p class="subtitle">Prepared for you</p>
        <svg class="top-ornament" viewBox="0 0 114 22" aria-hidden="true">
          <g fill="none" stroke="#aa8848" stroke-width="1.35">
            <path d="M0 11H42M72 11h42" opacity=".82"/>
            <path d="M57 2c1.3 5.1 3.9 7.7 9 9-5.1 1.3-7.7 3.9-9 9-1.3-5.1-3.9-7.7-9-9 5.1-1.3 7.7-3.9 9-9Z"/>
          </g>
          <circle cx="43.7" cy="11" r="1.8" fill="#aa8848"/>
          <circle cx="70.3" cy="11" r="1.8" fill="#aa8848"/>
        </svg>
      </header>

      <div class="envelope-wrap">
        <svg class="envelope-art" viewBox="0 0 838 693" preserveAspectRatio="none" role="img" aria-label="A large white floral lace envelope">
          <defs>
            <linearGradient id="bodyPaper" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffefb"/>
              <stop offset=".48" stop-color="#faf9f5"/>
              <stop offset="1" stop-color="#efeee9"/>
            </linearGradient>
            <pattern id="bodyLacePattern" width="838" height="693" patternUnits="userSpaceOnUse">
              <image x="0" y="-72" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
            </pattern>
          </defs>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="url(#bodyPaper)" stroke="#deddd7" stroke-width="2"/>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="url(#bodyLacePattern)" opacity=".84"/>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="#fff4e6" opacity=".10"/>
        </svg>

        <div class="liner-body" aria-hidden="true"></div>
        <div class="invitation-card" aria-hidden="true"></div>

        <svg class="pocket-art" viewBox="0 0 838 693" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sideLeft" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffaf2" stop-opacity=".58"/>
              <stop offset="1" stop-color="#ddd8cf" stop-opacity=".34"/>
            </linearGradient>
            <linearGradient id="sideRight" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff9f0" stop-opacity=".48"/>
              <stop offset="1" stop-color="#d9d4ca" stop-opacity=".42"/>
            </linearGradient>
            <linearGradient id="lowerPocket" x1=".12" y1="0" x2=".82" y2="1">
              <stop offset="0" stop-color="#fffaf2" stop-opacity=".54"/>
              <stop offset=".55" stop-color="#f7f2e9" stop-opacity=".36"/>
              <stop offset="1" stop-color="#dad4ca" stop-opacity=".44"/>
            </linearGradient>
            <pattern id="pocketLacePattern" width="838" height="693" patternUnits="userSpaceOnUse">
              <image x="0" y="-72" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
            </pattern>
          </defs>
          <path d="M1 1 352 315 1 693Z" fill="url(#pocketLacePattern)"/>
          <path d="M1 1 352 315 1 693Z" fill="url(#sideLeft)" stroke="#ffffff" stroke-opacity=".72" stroke-width="1.6"/>
          <path d="M837 1 486 315 837 693Z" fill="url(#pocketLacePattern)"/>
          <path d="M837 1 486 315 837 693Z" fill="url(#sideRight)" stroke="#c9c8c2" stroke-opacity=".44" stroke-width="1.3"/>
          <path d="M1 693V646Q5 615 29 581L335 299H503L809 581Q833 615 837 646V693Z" fill="url(#pocketLacePattern)"/>
          <path d="M1 693V646Q5 615 29 581L335 299H503L809 581Q833 615 837 646V693Z" fill="url(#lowerPocket)" stroke="#ffffff" stroke-opacity=".78" stroke-width="2"/>
          <path d="M1 693V646Q5 615 29 581L335 299" fill="none" stroke="#b8b7b1" stroke-opacity=".38" stroke-width="1.35"/>
          <path d="M837 693V646Q833 615 809 581L503 299" fill="none" stroke="#aaa9a3" stroke-opacity=".38" stroke-width="1.35"/>
        </svg>

        <div class="flap" aria-hidden="true">
          <div class="flap-face flap-front">
            <svg viewBox="0 0 838 420" preserveAspectRatio="none">
              <defs>
                <linearGradient id="closedFlap" x1=".08" y1="0" x2=".86" y2="1">
                  <stop offset="0" stop-color="#fffaf2" stop-opacity=".58"/>
                  <stop offset=".49" stop-color="#fcf7ee" stop-opacity=".34"/>
                  <stop offset="1" stop-color="#dbd5cb" stop-opacity=".42"/>
                </linearGradient>
                <pattern id="flapFrontLacePattern" width="838" height="420" patternUnits="userSpaceOnUse">
                  <image x="0" y="-209" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
              </defs>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#flapFrontLacePattern)" stroke="#ffffff" stroke-width="1.5"/>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#closedFlap)"/>
            </svg>
          </div>
          <div class="flap-face flap-back">
            <svg viewBox="0 0 838 420" preserveAspectRatio="none">
              <defs>
                <pattern id="flapBackLacePattern" width="838" height="420" patternUnits="userSpaceOnUse">
                  <image x="0" y="-160" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
              </defs>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#flapBackLacePattern)" stroke="#f5f4ef" stroke-width="1.4"/>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="#fff4e6" opacity=".09"/>
            </svg>
          </div>
        </div>

        <button class="seal-button" id="seal" type="button" aria-label="Open the private invitation">
          <img class="seal-art" src="invitation-assets/wax-seal-blank-optimized.png" alt="" aria-hidden="true">
          <span class="seal-initials" aria-hidden="true">
            <span class="seal-initial" data-seal-initial="first">A</span>
            <span class="seal-initial-divider"></span>
            <span class="seal-initial" data-seal-initial="second">G</span>
          </span>
        </button>
      </div>

      <footer class="footer">
        <p class="date">24 · 08 · 2027</p>
        <svg class="vertical-ornament" viewBox="0 0 20 132" aria-hidden="true">
          <g fill="none" stroke="#aa8848" stroke-width="1.25">
            <path d="M10 0V48M10 84v48"/>
            <path d="M10 48c1.7 10 4.8 15 10 18-5.2 3-8.3 8-10 18-1.7-10-4.8-15-10-18 5.2-3 8.3-8 10-18Z"/>
          </g>
          <circle cx="10" cy="1.5" r="1.6" fill="#aa8848"/>
          <circle cx="10" cy="130.5" r="1.6" fill="#aa8848"/>
        </svg>
        <p class="tap-copy">Tap the seal to open</p>
      </footer>

      <svg class="paper-texture" viewBox="0 0 942 1674" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="pagePaper" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency=".012 .34" numOctaves="5" seed="31" result="fibers"/>
            <feColorMatrix in="fibers" type="matrix" values=".45 0 0 0 .22  0 .38 0 0 .17  0 0 .28 0 .12  0 0 0 .28 0"/>
          </filter>
        </defs>
        <rect width="942" height="1674" fill="#8d7654" filter="url(#pagePaper)" opacity=".58"/>
      </svg>

      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="envelope.js?v=20260802-envelope-sequence" defer></script>
</body>
</html>
