<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ee">
  <meta name="description" content="Green sage wedding invitation for Layla and Zayn on 24 August 2027.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Green Sage – Wedding Invite — Layla &amp; Zayn">
  <meta property="og:description" content="Join us in Toronto on 24 August 2027.">
  <meta property="og:image" content="og.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="og.png">
  <link rel="preload" href="invitation-assets/envelope-liner-optimized.jpg" as="image">
  <link rel="preload" href="invitation-assets/envelope-lace-white.jpg" as="image">
  <link rel="preload" href="invitation-assets/wax-seal-blank-optimized.png" as="image">
  <link rel="preload" href="invitation-assets/opening-background-sage-flatlay.png" as="image">
  <title>Green Sage – Wedding Invite — Layla &amp; Zayn</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <input class="open-control" id="openControl" type="checkbox" tabindex="-1" aria-hidden="true">
    <section class="artboard" aria-label="Private invitation">
      <header class="heading">
        <h1>
          <span class="heading-kicker">A Private</span>
          <span class="heading-title">Invitation</span>
        </h1>
        <p class="subtitle">Prepared for you</p>
        <svg class="top-ornament" viewBox="0 0 114 22" aria-hidden="true">
          <g fill="none" stroke="#aa8848" stroke-width="1.35">
            <path d="M0 11H42M72 11h42" opacity=".82"/>
            <path d="M57 2c1.3 5.1 3.9 7.7 9 9-5.1 1.3-7.7 3.9-9 9-1.3-5.1-3.9-7.7-9-9 5.1-1.3 7.7-3.9 9-9Z"/>
          </g>
          <circle cx="43.7" cy="11" r="1.8" fill="#aa8848"/>
          <circle cx="70.3" cy="11" r="1.8" fill="#aa8848"/>
        </svg>
      </header>

      <div class="envelope-wrap">
        <svg class="envelope-art" viewBox="0 0 838 693" preserveAspectRatio="none" role="img" aria-label="A large white floral lace envelope">
          <defs>
            <linearGradient id="bodyPaper" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffefb"/>
              <stop offset=".48" stop-color="#faf9f5"/>
              <stop offset="1" stop-color="#efeee9"/>
            </linearGradient>
            <pattern id="bodyLacePattern" width="838" height="693" patternUnits="userSpaceOnUse">
              <image x="0" y="-72" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
            </pattern>
          </defs>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="url(#bodyPaper)" stroke="#deddd7" stroke-width="2"/>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="url(#bodyLacePattern)" opacity=".84"/>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="#fff4e6" opacity=".10"/>
        </svg>

        <div class="liner-body" aria-hidden="true"></div>
        <div class="invitation-card" aria-hidden="true"></div>

        <svg class="pocket-art" viewBox="0 0 838 693" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sideLeft" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffaf2" stop-opacity=".58"/>
              <stop offset="1" stop-color="#ddd8cf" stop-opacity=".34"/>
            </linearGradient>
            <linearGradient id="sideRight" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff9f0" stop-opacity=".48"/>
              <stop offset="1" stop-color="#d9d4ca" stop-opacity=".42"/>
            </linearGradient>
            <linearGradient id="lowerPocket" x1=".12" y1="0" x2=".82" y2="1">
              <stop offset="0" stop-color="#fffaf2" stop-opacity=".54"/>
              <stop offset=".55" stop-color="#f7f2e9" stop-opacity=".36"/>
              <stop offset="1" stop-color="#dad4ca" stop-opacity=".44"/>
            </linearGradient>
            <pattern id="pocketLacePattern" width="838" height="693" patternUnits="userSpaceOnUse">
              <image x="0" y="-72" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
            </pattern>
          </defs>
          <path d="M1 1 352 315 1 693Z" fill="url(#pocketLacePattern)"/>
          <path d="M1 1 352 315 1 693Z" fill="url(#sideLeft)" stroke="#ffffff" stroke-opacity=".72" stroke-width="1.6"/>
          <path d="M837 1 486 315 837 693Z" fill="url(#pocketLacePattern)"/>
          <path d="M837 1 486 315 837 693Z" fill="url(#sideRight)" stroke="#c9c8c2" stroke-opacity=".44" stroke-width="1.3"/>
          <path d="M1 693V646Q5 615 29 581L335 299H503L809 581Q833 615 837 646V693Z" fill="url(#pocketLacePattern)"/>
          <path d="M1 693V646Q5 615 29 581L335 299H503L809 581Q833 615 837 646V693Z" fill="url(#lowerPocket)" stroke="#ffffff" stroke-opacity=".78" stroke-width="2"/>
          <path d="M1 693V646Q5 615 29 581L335 299" fill="none" stroke="#b8b7b1" stroke-opacity=".38" stroke-width="1.35"/>
          <path d="M837 693V646Q833 615 809 581L503 299" fill="none" stroke="#aaa9a3" stroke-opacity=".38" stroke-width="1.35"/>
        </svg>

        <div class="flap" aria-hidden="true">
          <div class="flap-face flap-front">
            <svg viewBox="0 0 838 420" preserveAspectRatio="none">
              <defs>
                <linearGradient id="closedFlap" x1=".08" y1="0" x2=".86" y2="1">
                  <stop offset="0" stop-color="#fffaf2" stop-opacity=".58"/>
                  <stop offset=".49" stop-color="#fcf7ee" stop-opacity=".34"/>
                  <stop offset="1" stop-color="#dbd5cb" stop-opacity=".42"/>
                </linearGradient>
                <pattern id="flapFrontLacePattern" width="838" height="420" patternUnits="userSpaceOnUse">
                  <image x="0" y="-209" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
                <filter id="closedFlapShadow" x="-7%" y="-6%" width="114%" height="120%">
                  <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5b554c" flood-opacity=".20"/>
                </filter>
              </defs>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#flapFrontLacePattern)" stroke="#ffffff" stroke-width="1.5" filter="url(#closedFlapShadow)"/>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#closedFlap)"/>
            </svg>
          </div>
          <div class="flap-face flap-back">
            <svg viewBox="0 0 838 420" preserveAspectRatio="none">
              <defs>
                <pattern id="flapBackLacePattern" width="838" height="420" patternUnits="userSpaceOnUse">
                  <image x="0" y="-160" width="838" height="838" href="invitation-assets/envelope-lace-white.jpg" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
                <filter id="openFlapShadow" x="-7%" y="-7%" width="114%" height="120%">
                  <feDropShadow dx="0" dy="-3" stdDeviation="3" flood-color="#5b554c" flood-opacity=".20"/>
                </filter>
              </defs>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#flapBackLacePattern)" stroke="#f5f4ef" stroke-width="1.4" filter="url(#openFlapShadow)"/>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="#fff4e6" opacity=".09"/>
            </svg>
          </div>
        </div>

        <button class="seal-button" id="seal" type="button" aria-label="Open the private invitation">
          <img class="seal-art" src="invitation-assets/wax-seal-blank-optimized.png" alt="" aria-hidden="true">
          <span class="seal-initials" aria-hidden="true">
            <span class="seal-initial" data-seal-initial="first">A</span>
            <span class="seal-initial-divider"></span>
            <span class="seal-initial" data-seal-initial="second">E</span>
          </span>
        </button>
      </div>

      <footer class="footer">
        <p class="date">24 · 08 · 2027</p>
        <svg class="vertical-ornament" viewBox="0 0 20 132" aria-hidden="true">
          <g fill="none" stroke="#aa8848" stroke-width="1.25">
            <path d="M10 0V48M10 84v48"/>
            <path d="M10 48c1.7 10 4.8 15 10 18-5.2 3-8.3 8-10 18-1.7-10-4.8-15-10-18 5.2-3 8.3-8 10-18Z"/>
          </g>
          <circle cx="10" cy="1.5" r="1.6" fill="#aa8848"/>
          <circle cx="10" cy="130.5" r="1.6" fill="#aa8848"/>
        </svg>
        <p class="tap-copy">Tap the seal to open</p>
      </footer>

      <svg class="paper-texture" viewBox="0 0 942 1674" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="pagePaper" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency=".012 .34" numOctaves="5" seed="31" result="fibers"/>
            <feColorMatrix in="fibers" type="matrix" values=".45 0 0 0 .22  0 .38 0 0 .17  0 0 .28 0 .12  0 0 0 .28 0"/>
          </filter>
        </defs>
        <rect width="942" height="1674" fill="#8d7654" filter="url(#pagePaper)" opacity=".58"/>
      </svg>

      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </section>
    <div class="invitation-page" id="invitationPage" aria-hidden="true">
      <article class="story-page" aria-label="Wedding invitation opening">
        <div class="story-shell">
          <section class="story-section hero-invite reference-invite" aria-labelledby="coupleNames">
            <div class="reference-card">
              <div class="reference-copy">
                <svg class="reference-sprig" viewBox="0 0 64 30" aria-hidden="true">
                  <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2">
                    <path d="M8 24C23 20 34 14 50 5"/>
                    <path d="M22 19c-6-5-8-9-7-13 6 2 9 6 9 11M32 14c-2-7 0-11 3-14 4 5 4 9 0 13M40 10c5-5 9-6 13-5-2 5-6 8-12 8M17 21c-5 1-9 0-12-3 4-3 9-2 14 1"/>
                  </g>
                </svg>
                <p class="story-kicker">Together with their families</p>
                <div class="hero-formal-copy">
                  <p>You are joyfully invited to</p>
                  <p>Celebrate the wedding of</p>
                </div>
                <h2 class="couple-names" id="coupleNames">
                  <span>LAYLA</span>
                  <span class="ampersand">and</span>
                  <span>ZAYN</span>
                </h2>
                <div class="hero-divider" aria-hidden="true"><span>◇</span></div>
                <p class="reference-date-row">
                  <span>August</span>
                  <span class="reference-day">24</span>
                  <span>2027</span>
                </p>
                <p class="reference-time">Saturday, four thirty in the afternoon</p>
                <div class="reference-venue-rule" aria-hidden="true"></div>
                <p class="hero-place">
                  <strong>The Glasshouse Estate</strong>
                  <span>Toronto, Ontario</span>
                  <span class="reference-reception">Reception to follow</span>
                </p>
              </div>
            </div>
          </section>
        </div>
      </article>
    </div>
  </main>

  <script>
    (() => {
      const sealInitials = { first: 'A', second: 'E' };
      document.querySelectorAll('[data-seal-initial]').forEach((initial) => {
        initial.textContent = sealInitials[initial.dataset.sealInitial];
      });

      const root = document.documentElement;
      const artboard = document.querySelector('.artboard');
      const seal = document.getElementById('seal');
      const status = document.getElementById('status');
      const control = document.getElementById('openControl');
      const invitationPage = document.getElementById('invitationPage');
      const card = document.querySelector('.invitation-card');
      const flap = document.querySelector('.flap');
      const referenceCard = document.querySelector('.reference-card');
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let openingStarted = false;
      let cardPullStarted = false;
      let revealStarted = false;
      let navigationStarted = false;
      let openingFallback = 0;

      const fontsReady = document.fonts?.ready ?? Promise.resolve();
      const openingAssetsReady = Promise.race([
        fontsReady,
        new Promise((resolve) => window.setTimeout(resolve, 1200))
      ]);
      const nextPaint = () => new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });

      const finishOpening = () => {
        if (navigationStarted) return;
        navigationStarted = true;
        window.clearTimeout(openingFallback);
        window.location.assign('invitation.html');
      };

      const revealInvitation = async () => {
        if (revealStarted) return;
        revealStarted = true;
        const sourceRect = card.getBoundingClientRect();

        await openingAssetsReady;
        root.classList.add('invitation-opening');
        artboard.classList.add('opening-complete');
        invitationPage.setAttribute('aria-hidden', 'false');
        invitationPage.classList.add('is-preparing');

        await nextPaint();

        const targetRect = referenceCard.getBoundingClientRect();
        const sourceCenterX = sourceRect.left + sourceRect.width / 2;
        const sourceCenterY = sourceRect.top + sourceRect.height / 2;
        const targetCenterX = targetRect.left + targetRect.width / 2;
        const targetCenterY = targetRect.top + targetRect.height / 2;

        referenceCard.style.setProperty('--page-start-x', `${sourceCenterX - targetCenterX}px`);
        referenceCard.style.setProperty('--page-start-y', `${sourceCenterY - targetCenterY}px`);
        referenceCard.style.setProperty('--page-start-scale-x', sourceRect.width / targetRect.width);
        referenceCard.style.setProperty('--page-start-scale-y', sourceRect.height / targetRect.height);

        if (reduceMotion) {
          finishOpening();
          return;
        }

        const finishReveal = (event) => {
          if (event && event.animationName !== 'openingCardReveal') return;
          referenceCard.removeEventListener('animationend', finishReveal);
          finishOpening();
        };

        referenceCard.addEventListener('animationend', finishReveal);
        window.setTimeout(() => finishReveal(), 1100);
        invitationPage.classList.remove('is-preparing');
        invitationPage.classList.add('is-revealing');
      };

      const openInvitation = () => {
        if (openingStarted) return;
        openingStarted = true;
        seal.disabled = true;
        seal.classList.add('is-tapped');
        control.checked = true;
        status.textContent = 'Opening the invitation.';

        openingFallback = window.setTimeout(finishOpening, 5200);

        if (reduceMotion) {
          revealInvitation();
          return;
        }

        const startCardPull = () => {
          if (cardPullStarted) return;
          cardPullStarted = true;

          const finishCardPull = (event) => {
            if (event && event.animationName !== 'cardJourney') return;
            card.removeEventListener('animationend', finishCardPull);
            revealInvitation();
          };

          card.addEventListener('animationend', finishCardPull);
          window.setTimeout(() => finishCardPull(), 2300);
          artboard.classList.add('card-pulling');
        };

        const finishFlap = (event) => {
          if (event && event.type === 'animationend' && event.animationName !== 'flapBackOpen') return;
          flap.removeEventListener('animationend', finishFlap);
          flap.removeEventListener('animationcancel', finishFlap);
          startCardPull();
        };

        flap.addEventListener('animationend', finishFlap);
        flap.addEventListener('animationcancel', finishFlap);
        window.setTimeout(() => finishFlap(), 1400);
      };

      const requestOpening = (event) => {
        if (event.type === 'mousedown' && event.button !== 0) return;
        openInvitation();
      };

      seal.addEventListener('mousedown', requestOpening);
      seal.addEventListener('click', requestOpening);

      window.addEventListener('pageshow', (event) => {
        if (event.persisted) window.location.reload();
      });
    })();
  </script>
</body>
</html>
