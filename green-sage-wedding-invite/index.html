<html lang="en">
<head>
  <meta charset="utf-8">

  <link rel="preload" href="invitation-assets/envelope-liner-optimized.jpg" as="image">
  <link rel="preload" href="invitation-assets/envelope-paper-greige.jpg" as="image">

  <title>Green Sage – Wedding Invite — Alexandra &amp; Gabriel</title>
  <link rel="stylesheet" href="styles.css?v=20260828-envelope-material-v1">
</head>
<body>
  <main class="page">
    <input class="open-control" id="openControl" type="checkbox" tabindex="-1" aria-hidden="true">
    <section class="artboard" aria-label="Private invitation">
      <header class="heading">
        <h1>
          <span class="heading-kicker">A Private</span>
          <span class="heading-title">Invitation</span>
        </h1>
        <p class="subtitle">For you</p>
      </header>

      <div class="envelope-wrap">
        <svg class="envelope-art" viewBox="0 0 838 693" preserveAspectRatio="none" role="img" aria-label="A large white floral lace envelope">
          <defs>
            <linearGradient id="bodyPaper" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffefb"/>
              <stop offset=".48" stop-color="#faf9f5"/>
              <stop offset="1" stop-color="#efeee9"/>
            </linearGradient>
            <pattern id="bodyLacePattern" width="838" height="693" patternUnits="userSpaceOnUse">
              <image x="0" y="-72" width="838" height="838" href="invitation-assets/envelope-paper-greige.jpg" preserveAspectRatio="xMidYMid slice"/>
            </pattern>
          </defs>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="url(#bodyPaper)" stroke="#c9c6bf" stroke-opacity=".46" stroke-width="2"/>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="url(#bodyLacePattern)" opacity=".84"/>
          <rect x="1" y="1" width="836" height="691" rx="1" fill="#fff4e6" opacity=".10"/>
        </svg>

        <div class="liner-body" aria-hidden="true"></div>
        <div class="invitation-card" aria-hidden="true"></div>

        <svg class="pocket-art" viewBox="0 0 838 693" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="sideLeft" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fffaf2" stop-opacity=".58"/>
              <stop offset="1" stop-color="#ddd8cf" stop-opacity=".34"/>
            </linearGradient>
            <linearGradient id="sideRight" x1="1" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff9f0" stop-opacity=".48"/>
              <stop offset="1" stop-color="#d9d4ca" stop-opacity=".42"/>
            </linearGradient>
            <linearGradient id="lowerPocket" x1=".12" y1="0" x2=".82" y2="1">
              <stop offset="0" stop-color="#fffaf2" stop-opacity=".54"/>
              <stop offset=".55" stop-color="#f7f2e9" stop-opacity=".36"/>
              <stop offset="1" stop-color="#dad4ca" stop-opacity=".44"/>
            </linearGradient>
            <pattern id="pocketLacePattern" width="838" height="693" patternUnits="userSpaceOnUse">
              <image x="0" y="-72" width="838" height="838" href="invitation-assets/envelope-paper-greige.jpg" preserveAspectRatio="xMidYMid slice"/>
            </pattern>
          </defs>
          <path d="M1 1 352 315 1 693Z" fill="url(#pocketLacePattern)"/>
          <path d="M1 1 352 315 1 693Z" fill="url(#sideLeft)" stroke="#c7c3bb" stroke-opacity=".34" stroke-width="1.6"/>
          <path d="M837 1 486 315 837 693Z" fill="url(#pocketLacePattern)"/>
          <path d="M837 1 486 315 837 693Z" fill="url(#sideRight)" stroke="#bdbab3" stroke-opacity=".30" stroke-width="1.3"/>
          <path d="M1 693V646Q5 615 29 581L335 299H503L809 581Q833 615 837 646V693Z" fill="url(#pocketLacePattern)"/>
          <path d="M1 693V646Q5 615 29 581L335 299H503L809 581Q833 615 837 646V693Z" fill="url(#lowerPocket)" stroke="#c7c3bb" stroke-opacity=".36" stroke-width="2"/>
          <path d="M1 693V646Q5 615 29 581L335 299" fill="none" stroke="#d3cdc4" stroke-opacity=".28" stroke-width="1.35"/>
          <path d="M837 693V646Q833 615 809 581L503 299" fill="none" stroke="#d3cdc4" stroke-opacity=".28" stroke-width="1.35"/>
        </svg>

        <div class="flap" aria-hidden="true">
          <div class="flap-face flap-front">
            <svg viewBox="0 0 838 420" preserveAspectRatio="none">
              <defs>
                <linearGradient id="closedFlap" x1=".08" y1="0" x2=".86" y2="1">
                  <stop offset="0" stop-color="#fffaf2" stop-opacity=".58"/>
                  <stop offset=".49" stop-color="#fcf7ee" stop-opacity=".34"/>
                  <stop offset="1" stop-color="#dbd5cb" stop-opacity=".42"/>
                </linearGradient>
                <pattern id="flapFrontLacePattern" width="838" height="420" patternUnits="userSpaceOnUse">
                  <image x="0" y="-209" width="838" height="838" href="invitation-assets/envelope-paper-greige.jpg" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
              </defs>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#flapFrontLacePattern)" stroke="#c8c4bc" stroke-opacity=".38" stroke-width="1.5"/>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#closedFlap)"/>
            </svg>
          </div>
          <div class="flap-face flap-back">
            <svg viewBox="0 0 838 420" preserveAspectRatio="none">
              <defs>
                <pattern id="flapBackLacePattern" width="838" height="420" patternUnits="userSpaceOnUse">
                  <image x="0" y="-160" width="838" height="838" href="invitation-assets/envelope-paper-greige.jpg" preserveAspectRatio="xMidYMid slice"/>
                </pattern>
              </defs>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="url(#flapBackLacePattern)" stroke="#c8c4bc" stroke-opacity=".34" stroke-width="1.4"/>
              <path d="M1 1H837Q832 48 823 67 813 88 789 107L447 392Q419 426 391 392L49 107Q25 88 15 67 6 48 1 1Z" fill="#fff4e6" opacity=".09"/>
            </svg>
          </div>
        </div>

        <button class="seal-button" id="seal" type="button" aria-label="Open the private invitation">
          <img class="seal-art" src="invitation-assets/wax-seal-blank-optimized.png" alt="" aria-hidden="true">
          <span class="seal-initials" aria-hidden="true">
            <span class="seal-initial" data-seal-initial="first">A</span>
            <span class="seal-initial-divider"></span>
            <span class="seal-initial" data-seal-initial="second">G</span>
          </span>
        </button>
      </div>

      <footer class="footer">
        <p class="tap-copy">Tap the seal to open</p>
      </footer>

      <svg class="paper-texture" viewBox="0 0 942 1674" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <filter id="pagePaper" x="-5%" y="-5%" width="110%" height="110%">
            <feTurbulence type="fractalNoise" baseFrequency=".012 .34" numOctaves="5" seed="31" result="fibers"/>
            <feColorMatrix in="fibers" type="matrix" values=".22 0 0 0 .58  0 .22 0 0 .57  0 0 .20 0 .54  0 0 0 .24 0"/>
          </filter>
        </defs>
        <rect width="942" height="1674" fill="#d2cec5" filter="url(#pagePaper)" opacity=".46"/>
      </svg>

      <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    </section>
    <iframe
      class="invitation-handoff"
      src="invitation.html?v=20260814-no-text-flash-v3&amp;handoff=1"
      title="Invitation preview"
      tabindex="-1"
      aria-hidden="true"
    ></iframe>
  </main>
  <script src="envelope.js?v=20260814-no-text-flash-v3" defer></script>
</body>
</html>
