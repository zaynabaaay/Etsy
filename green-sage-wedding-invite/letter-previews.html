<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ec">
  <title>Letter Section Concepts</title>
  <style>
    :root {
      color-scheme: light;
      --ivory: #f7f4ec;
      --ink: #454437;
      --muted: #737364;
      --gold: #a37e46;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font-family: Baskerville, "Baskerville Old Face", "Iowan Old Style", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      padding: clamp(44px, 7vw, 92px) 24px clamp(34px, 5vw, 64px);
      text-align: center;
    }

    .eyebrow,
    .concept-number {
      margin: 0;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0 10px;
      font-size: clamp(34px, 5vw, 66px);
      font-weight: 400;
      letter-spacing: .03em;
    }

    .intro {
      max-width: 620px;
      margin: 0 auto;
      color: var(--muted);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.55;
    }

    main {
      width: min(100%, 1500px);
      margin: 0 auto;
      padding: 0 clamp(12px, 2.5vw, 38px) 80px;
    }

    figure {
      margin: 0 0 clamp(56px, 8vw, 112px);
    }

    .image-frame {
      overflow: hidden;
      border: 1px solid rgba(115, 107, 84, .16);
      background: #eeeae0;
      box-shadow: 0 18px 55px rgba(74, 68, 54, .12);
    }

    img {
      display: block;
      width: 100%;
      height: auto;
    }

    figcaption {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      padding: 18px 4px 0;
    }

    h2 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      font-weight: 400;
    }

    .concept-number { white-space: nowrap; }

    @media (max-width: 600px) {
      figcaption {
        align-items: flex-start;
        flex-direction: column-reverse;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <header>
    <p class="eyebrow">Green Sage Wedding</p>
    <h1>Letter Section Concepts</h1>
    <p class="intro">Five visual directions for the message to your guests. The final wording will remain crisp, editable webpage text placed over the selected design.</p>
  </header>

  <main>
    <figure>
      <div class="image-frame">
        <img src="invitation-assets/letter-previews/01-frosted-vellum.png" alt="Frosted vellum letter concept over ivory silk" decoding="async">
      </div>
      <figcaption>
        <h2>Frosted vellum over silk</h2>
        <p class="concept-number">Concept 01</p>
      </figcaption>
    </figure>

    <figure>
      <div class="image-frame">
        <img src="invitation-assets/letter-previews/02-deckled-sage-ribbon.png" alt="Deckled ivory paper concept with a straight sage ribbon" loading="lazy" decoding="async">
      </div>
      <figcaption>
        <h2>Deckled paper and sage ribbon</h2>
        <p class="concept-number">Concept 02</p>
      </figcaption>
    </figure>

    <figure>
      <div class="image-frame">
        <img src="invitation-assets/letter-previews/03-lace-frame.png" alt="Ivory stationery concept framed by white lace" loading="lazy" decoding="async">
      </div>
      <figcaption>
        <h2>Lace-framed stationery</h2>
        <p class="concept-number">Concept 03</p>
      </figcaption>
    </figure>

    <figure>
      <div class="image-frame">
        <img src="invitation-assets/letter-previews/04-pressed-botanicals.png" alt="Ivory letter concept with pressed white flowers and sage leaves" loading="lazy" decoding="async">
      </div>
      <figcaption>
        <h2>Pressed botanical border</h2>
        <p class="concept-number">Concept 04</p>
      </figcaption>
    </figure>

    <figure>
      <div class="image-frame">
        <img src="invitation-assets/letter-previews/05-frosted-glass.png" alt="Frosted glass letter concept with sage ribbon and gold medallion" loading="lazy" decoding="async">
      </div>
      <figcaption>
        <h2>Frosted glass and antique gold</h2>
        <p class="concept-number">Concept 05</p>
      </figcaption>
    </figure>
  </main>
</body>
</html>
